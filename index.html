<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Operations Command Center</title>
  <link rel="icon" href="/static/pmg.logo.png" type="image/png">
  <!-- Global Frontend Error Reporter -->
  <script>
    window.addEventListener('error', function(e) {
      console.error("Global captured error:", e);
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '20px';
      errorDiv.style.left = '20px';
      errorDiv.style.right = '20px';
      errorDiv.style.background = '#fef2f2';
      errorDiv.style.color = '#991b1b';
      errorDiv.style.padding = '20px';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.style.fontSize = '13px';
      errorDiv.style.zIndex = '99999';
      errorDiv.style.border = '2px solid #ef4444';
      errorDiv.style.borderRadius = '8px';
      errorDiv.style.boxShadow = '0 10px 25px rgba(0,0,0,0.15)';
      errorDiv.innerHTML = '<h3 style="margin-top:0;font-size:16px;font-weight:bold;">Frontend Runtime Error Detected</h3>' +
        '<p style="margin: 10px 0;"><strong>Error:</strong> ' + e.message + '</p>' +
        '<p style="margin: 10px 0;"><strong>Source:</strong> ' + e.filename + '</p>' +
        '<p style="margin: 0;"><strong>Line:</strong> ' + e.lineno + ' | <strong>Column:</strong> ' + e.colno + '</p>';
      if (document.body) {
        document.body.appendChild(errorDiv);
      } else {
        document.documentElement.appendChild(errorDiv);
      }
    });
  </script>

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
            display: ['Rajdhani', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'scanline': 'scanline 8s linear infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            scanline: {
              '0%': { transform: 'translateY(-100%)' },
              '100%': { transform: 'translateY(100%)' }
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(22, 163, 74, 0.15), 0 0 10px rgba(22, 163, 74, 0.08)' },
              '100%': { boxShadow: '0 0 20px rgba(22, 163, 74, 0.35), 0 0 30px rgba(22, 163, 74, 0.15)' }
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for JSX — react preset ONLY (no "env" preset, which breaks UMD globals) -->
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(243, 244, 246, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(22, 163, 74, 0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(22, 163, 74, 0.45); }

    .scanlines::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .glass-panel-active {
      background: rgba(22, 163, 74, 0.06);
      border: 1px solid rgba(22, 163, 74, 0.25);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-full overflow-hidden antialiased">
  <div id="root" class="h-full w-full"></div>

  <!--
    KEY FIX: type="text/babel" with data-presets="react" only.
    DO NOT add "env" to data-presets — the env preset tries to rewrite
    import/export statements, which are not valid in a browser UMD context
    where React/ReactDOM are already available as window globals.
    The "react" preset only transforms JSX, which is all we need here.
  -->
  <script type="text/babel" data-presets="react" data-type="module" src="/static/app.js"></script>
</body>
</html>
